<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dance Check — Vũ Điệu Của Bạn</title>
<style>
  :root {
    --bg:#fdfaf9; --panel:#ffffff; --line:#f0e4e6;
    --rose:#d98ca0; --rose-d:#b9647e; --rose-l:#fbeef1;
    --ink:#3d3236; --ink-dim:#9a8b90;
    --warn:#c25b75;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body {
    margin:0; padding:20px; min-height:100%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% -10%, #fff 0%, #fbeef1 45%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--ink); font-family:"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
  }
  button, input, textarea, select { font-family:inherit; }
  .game { width:100%; max-width:480px; padding:28px 24px 30px; background:var(--panel);
    border:1px solid var(--line); border-radius:22px; box-shadow:0 18px 45px rgba(185,100,126,.12); }
  .hud { display:flex; align-items:center; gap:10px; margin-bottom:20px; font-size:12px; color:var(--ink-dim); letter-spacing:.04em; }
  .bar { flex:1; height:5px; background:var(--rose-l); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#efb5c4,var(--rose-d)); border-radius:3px; transition:width .35s; }
  h1 { font-size:30px; line-height:1.25; margin:4px 0 12px; color:var(--ink); font-weight:700; }
  h2 { font-size:20px; line-height:1.35; margin:0 0 6px; font-weight:700; color:var(--ink); }
  h3 { color:var(--rose-d); margin:22px 0 8px; font-size:14px; font-weight:700; }
  .sub { font-weight:400; color:var(--ink-dim); margin:0 0 16px; line-height:1.6; font-size:14.5px; }
  .notice { background:var(--rose-l); border:1px solid #f1d3da; border-radius:14px; padding:13px 15px; font-size:13px;
    line-height:1.6; color:#7a5160; margin:0 0 16px; text-align:left; }
  .joke { font-weight:500; color:var(--warn); font-size:13.5px; margin:12px 0 0; min-height:18px; font-style:italic; }
  input, textarea { width:100%; padding:13px 14px; font-size:16px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:12px; font-family:inherit; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--rose); outline-offset:2px; }
  select { width:100%; padding:13px 8px; font-size:16px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:12px; font-family:inherit; }
  select:focus { outline:2px solid var(--rose); outline-offset:2px; }
  .dob { display:grid; grid-template-columns:1fr 1.5fr 1.2fr; gap:8px; }
  input[type=color] { height:60px; padding:4px; cursor:pointer; }
  .opts { display:grid; gap:9px; } .opts.two { grid-template-columns:1fr 1fr; }
  .opt, .go, .ghost { font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; padding:13px 15px; border-radius:14px;
    border:1px solid var(--line); background:#fff; text-align:left; transition:transform .1s, background .15s, border-color .15s; }
  .opt:hover { background:var(--rose-l); border-color:var(--rose); transform:translateY(-1px); }
  .opt.on { background:var(--rose); color:#fff; border-color:var(--rose); font-weight:600; }
  .go { width:100%; margin-top:16px; text-align:center; background:linear-gradient(135deg,#e5a0b3,var(--rose-d)); color:#fff; border:none; font-size:15.5px; font-weight:600; box-shadow:0 6px 16px rgba(185,100,126,.25); }
  .go:hover { filter:brightness(1.05); }
  .go:disabled { opacity:.45; cursor:not-allowed; filter:none; box-shadow:none; }
  .ghost { width:100%; margin-top:9px; text-align:center; font-size:13px; color:var(--ink-dim); background:transparent; }
  .err { color:var(--warn); font-weight:600; min-height:18px; margin:8px 0 0; font-size:13px; }
  .arena { position:relative; height:260px; background:#fffafb; border:1.5px dashed #ecd0d7; border-radius:18px; overflow:hidden; }
  .arena .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-size:14px; color:var(--ink-dim); }
  .tgt { position:absolute; border-radius:50%; border:none; background:radial-gradient(circle at 35% 30%, #f6c6d2, var(--rose-d)); cursor:pointer; padding:0;
    box-shadow:0 0 0 4px rgba(217,140,160,.2); }
  .tgt.decoy { background:#cfc6c9; box-shadow:0 0 0 4px rgba(190,180,184,.2); }
  .preview { width:100%; max-height:220px; object-fit:contain; border-radius:14px; border:1px solid var(--line); margin-top:10px; display:none; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; font-size:13px; font-weight:500; }
  .row b { width:118px; color:var(--ink-dim); font-weight:500; } .row .m { flex:1; height:8px; background:var(--rose-l); border-radius:4px; overflow:hidden; } .row .m i { display:block; height:100%; background:linear-gradient(90deg,#efb5c4,var(--rose-d)); border-radius:4px; }
  .tag { display:inline-block; margin:3px; padding:5px 12px; background:var(--rose-l); border:1px solid #f1d3da; border-radius:20px; font-size:12.5px; color:var(--rose-d); }
  ul.kl { padding-left:18px; margin:0; font-weight:400; line-height:1.65; font-size:14.5px; }
  ul.kl li { margin-bottom:9px; }
  .center { text-align:center; } .big { font-size:52px; margin:4px 0; }
  .pop { animation:pop .3s ease; } @keyframes pop { from { transform:translateY(6px); opacity:0; } to { transform:none; opacity:1; } }
  .spin { display:inline-block; animation:sp 1.6s ease-in-out infinite; } @keyframes sp { 0%,100% { transform:rotate(-12deg) scale(1); } 50% { transform:rotate(12deg) scale(1.1); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="game" id="game"></div>

<script>
const ACCESS_KEY = "4fb1602e-a2e8-4d1c-9c81-caf567b8d8d2";
const CREATORS = "Thiết bị Kan";

const G = document.getElementById("game");
const ans = {};
const L = [];
let idx = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
const next = () => { idx++; idx < L.length ? L[idx]() : finish(); };

function hud() {
  const p = Math.round(idx / (L.length - 1) * 100);
  return `<div class="hud"><span>BƯỚC ${idx}/${L.length - 1}</span><div class="bar"><i style="width:${p}%"></i></div><span>♪ ${idx*10}</span></div>`;
}
function show(inner) { G.innerHTML = hud() + `<div class="pop">${inner}</div>`; }

function ask(key, title, sub, o = {}) {
  L.push(() => {
    const type = o.type || "text", dob = type === "dob", yr = new Date().getFullYear();
    const opt = (a, n, f) => Array.from({length:n}, (_, i) => f(a(i))).join("");
    const field = dob
      ? `<div class="dob"><select id="dd" aria-label="Ngày"><option value="">Ngày</option>${opt(i => i + 1, 31, v => `<option value="${v}">${v}</option>`)}</select>
         <select id="dm" aria-label="Tháng"><option value="">Tháng</option>${opt(i => i + 1, 12, v => `<option value="${v}">Tháng ${v}</option>`)}</select>
         <select id="dy" aria-label="Năm"><option value="">Năm</option>${opt(i => yr - i, 100, v => `<option value="${v}">${v}</option>`)}</select></div>
         <p class="sub" id="dobv" style="margin:10px 0 0"></p>`
      : type === "area" ? `<textarea id="in" rows="3" placeholder="${o.ph||""}"></textarea>`
      : `<input id="in" type="${type}" ${type==="color"?'value="#f4b6c6"':""} placeholder="${o.ph||""}">`;
    show(`<h2>${title}</h2><p class="sub">${sub}</p>${field}<p class="err" id="err"></p>
      <p class="joke">${o.joke||""}</p><button class="go" id="ok">${o.btn||"Tiếp tục"}</button>`);
    const err = document.getElementById("err");
    let el = null, dd, dm, dy;
    if (dob) {
      dd = document.getElementById("dd"); dm = document.getElementById("dm"); dy = document.getElementById("dy");
      const prev = () => { document.getElementById("dobv").textContent = (dd.value && dm.value && dy.value) ? `Ngày sinh: ${dd.value} tháng ${dm.value}, ${dy.value}` : ""; };
      [dd, dm, dy].forEach(x => x.onchange = prev); dd.focus();
    } else { el = document.getElementById("in"); el.focus(); }
    const go = () => {
      let v;
      if (dob) {
        const d = +dd.value, m = +dm.value, y = +dy.value;
        if (!d || !m || !y) { err.textContent = "Chọn đủ ngày, tháng, năm nhé."; return; }
        const t = new Date(y, m - 1, d);
        if (t.getMonth() !== m - 1 || t.getDate() !== d || t > new Date()) { err.textContent = "Ngày này không có thật (hoặc ở tương lai), kiểm tra lại giúp nhé."; return; }
        v = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      } else v = el.value.trim();
      if (!v) { err.textContent = o.empty || "Bạn điền một chút rồi mình đi tiếp nhé."; return; }
      ans[key] = v; next();
    };
    document.getElementById("ok").onclick = go;
    if (!dob && type !== "area") el.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}
function pick(key, title, sub, opts, o = {}) {
  L.push(() => {
    const all = o.other ? [...opts, o.other] : opts;
    show(`<h2>${title}</h2><p class="sub">${sub}</p><div class="opts ${o.two?"two":""}">` +
      all.map(x => `<button class="opt">${x}</button>`).join("") + `</div><div id="othbox"></div><p class="joke" id="j"></p>`);
    G.querySelectorAll(".opt").forEach((b, n) => b.onclick = () => {
      if (o.other && n === opts.length) {
        G.querySelectorAll(".opt").forEach(x => x.classList.remove("on")); b.classList.add("on");
        document.getElementById("j").textContent = "";
        const box = document.getElementById("othbox");
        box.innerHTML = `<input id="oth" maxlength="80" placeholder="${o.otherPh || "Tự điền ở đây..."}" style="margin-top:12px"><p class="err" id="oerr"></p><button class="go" id="ook" style="margin-top:6px">Chốt</button>`;
        const inp = document.getElementById("oth"); inp.focus();
        const done = () => { const v = inp.value.trim(); if (!v) { document.getElementById("oerr").textContent = "Gõ vài chữ rồi chốt nhé."; return; }
          G.querySelectorAll(".opt").forEach(x => x.onclick = null); ans[key] = "✍️ Tự điền: " + v; next(); };
        document.getElementById("ook").onclick = done; inp.onkeydown = e => { if (e.key === "Enter") done(); };
        return;
      }
      G.querySelectorAll(".opt").forEach(x => x.onclick = null);
      b.classList.add("on"); ans[key] = b.textContent;
      if (o.jokes) document.getElementById("j").textContent = o.jokes[n];
      setTimeout(next, o.jokes ? 900 : 200);
    });
  });
}

// ===== MÀN MỞ ĐẦU — nói rõ ngay từ đầu =====
L.push(() => {
  G.innerHTML = `<div class="center pop"><div class="big">🩰</div><h1>Dance Check</h1>
    <p class="notice">Bài trắc nghiệm vui này do <b>${CREATORS}</b> tạo ra, dành riêng cho người được gửi link này.
    Những gì bạn nhập — tên, ngày sinh, vài câu trả lời vui, và (nếu bạn muốn) một tấm ảnh bạn tự chọn tải lên —
    sẽ được gửi cho <b>${CREATORS}</b> xem. Ảnh là tự nguyện, bạn chọn ảnh nào thì gửi ảnh đó.
    Tiếp tục nghĩa là bạn đồng ý với điều đó.</p>
    <p class="sub">Qua ${L.length - 1} bước nhỏ để khám phá phong cách múa của bạn, cung hoàng đạo và vài điều thú vị khác. Cứ thoải mái, không có đúng hay sai.</p>
    <button class="go" id="st">Tôi hiểu, bắt đầu thôi</button></div>`;
  document.getElementById("st").onclick = () => next();
});

ask("Ten", "TÊN TRÊN SÂN KHẤU", "Tên thật hay nghệ danh, tuỳ bạn.", { ph:"VD: Dance...", joke:"Một cái tên đẹp là màn chào sân hoàn hảo.", btn:"Chốt tên" });

// Mini-game nhịp: 7 vòng, bắt nhịp bằng bia hồng, bia xám là bước lạc nhịp
L.push(() => {
  show(`<h2>THỬ BẮT NHỊP</h2><p class="sub">7 nhịp. Chạm vào nốt hồng ngay khi nó hiện ra. Nốt xám là bước lạc nhịp — chạm nhầm sẽ bị trừ điểm. Nốt nhỏ dần theo từng nhịp.</p>
    <div class="arena" id="ar"><div class="msg">Chuẩn bị tư thế nhé...</div></div><p class="joke" id="j"></p>`);
  const ar = document.getElementById("ar"), j = document.getElementById("j"), t = [];
  const ROUNDS = 7;
  const lines = ["Khởi động nhẹ.", "Vào nhịp rồi.", "Rất mượt.", "Giữ nhịp thở đều nhé.", "Quá nửa rồi.", "Gần tới đoạn cuối.", "Cúi chào khán giả!"];
  function spawnDecoy() {
    const size = 50;
    const b = document.createElement("button"); b.className = "tgt decoy"; b.style.width = b.style.height = size + "px";
    b.style.left = Math.random() * (ar.clientWidth - size) + "px"; b.style.top = Math.random() * (ar.clientHeight - size) + "px";
    b.onclick = () => { t[t.length-1] = (t[t.length-1]||0) + 260; j.textContent = "Bước lạc nhịp rồi, thử lại nhé."; };
    ar.appendChild(b);
    setTimeout(() => b.remove(), 650);
  }
  function round() {
    if (t.length === ROUNDS) {
      const avg = Math.round(t.reduce((a, b) => a + b) / ROUNDS); ans.Phan_xa_ms = avg;
      j.textContent = avg < 420 ? "Bắt nhịp nhanh và gọn, rất có năng khiếu." : avg < 600 ? "Nhịp ổn định, luyện thêm là mượt hơn nữa." : "Chậm rãi nhưng chắc chắn, kiểu người múa có chiều sâu.";
      return setTimeout(next, 1400);
    }
    ar.innerHTML = `<div class="msg">Lắng nghe nhịp...</div>`;
    if (Math.random() < 0.5) setTimeout(spawnDecoy, 300 + Math.random() * 900);
    setTimeout(() => {
      ar.innerHTML = "";
      const size = Math.max(32, 58 - t.length * 3);
      const b = document.createElement("button"); b.className = "tgt"; b.style.width = b.style.height = size + "px";
      b.style.left = Math.random() * (ar.clientWidth - size) + "px"; b.style.top = Math.random() * (ar.clientHeight - size) + "px";
      const s = performance.now();
      b.onclick = () => { t.push(performance.now() - s); j.textContent = lines[t.length - 1]; round(); };
      ar.appendChild(b);
    }, 700 + Math.random() * 1300);
  }
  setTimeout(round, 900);
});

ask("Ngay_sinh", "NGÀY CỦA BẠN", "Ngày sinh thật của bạn, để mình tính cung hoàng đạo cho chuẩn.", { type:"dob", joke:"Mỗi cung hoàng đạo có một kiểu múa riêng đó.", btn:"Xác nhận" });
ask("So_yeu_thich", "NHỊP ĐẾM CỦA BẠN", "Một con số bạn thích, số nào cũng được.", { type:"number", ph:"Số may mắn", joke:"Có thể đó là nhịp 1-2-3-4 của bạn.", btn:"Chốt số" });
pick("Tuyp", "THỂ LOẠI CỦA BẠN", "Nếu được lên sân khấu ngay bây giờ, bạn chọn thể loại nào?",
  ["🩰 Ballet: nhẹ nhàng, thanh thoát", "🔥 Hip-hop / Dance cover: bung năng lượng", "🌊 Contemporary: nhảy theo cảm xúc"],
  { other:"✍️ Khác: tự điền", otherPh:"VD: dân gian, salsa, K-pop, múa quạt...", jokes:["Thanh lịch và kiên nhẫn, rất hợp một nàng thơ.", "Nhịp mạnh, năng lượng tràn, sân khấu sáng hẳn lên.", "Nhảy bằng cảm xúc, không cần đếm nhịp cũng đẹp."] });
pick("Dong_vat", "BẠN ĐỒNG HÀNH", "Sau giờ tập, bạn muốn có ai ở nhà chờ?",
  ["🐶 Chó: nhiệt tình chào đón", "🐱 Mèo: ngồi nhìn bạn tập rất nghiêm túc", "🐾 Cả hai: nhà luôn rộn ràng", "🌿 Không nuôi: một mình thư thả"],
  { jokes:["Luôn là fan cuồng số một.", "Khán giả khó tính nhưng đáng yêu.", "Một đội cổ vũ nhỏ xinh.", "Có không gian riêng cũng rất tuyệt."] });
pick("Mua_thich", "MÙA CỦA SÂN KHẤU", "Mùa nào hợp với buổi biểu diễn trong mơ của bạn?", ["🌸 Xuân", "☀️ Hạ", "🍂 Thu", "❄️ Đông"], { two:true });
ask("Mau_yeu_thich", "MÀU VÁY MÚA", "Chọn màu của bộ váy múa bạn thích nhất.", { type:"color", joke:"Màu nào mặc lên sân khấu cũng đẹp nếu bạn tự tin.", btn:"Chọn màu này" });
pick("Size_ao", "TIỆM ĐỒ: ĐỒ TẬP", "Size đồ tập (áo leotard, áo crop...) của bạn là gì?", ["S", "M", "L", "XL", "XXL"], { two:true, jokes:["Gọn nhẹ như cánh bướm.","Vừa vặn, chuẩn dáng.","Thoải mái vận động.","Rộng rãi, tự do.","Thoải mái nhất."] });
ask("Size_giay", "TIỆM ĐỒ: GIÀY MÚA", "Bạn đi giày size mấy?", { ph:"VD: 38", joke:"Một đôi giày hợp chân là nửa bài múa rồi.", btn:"Thử giày" });
ask("Do_an_thich", "NẠP NĂNG LƯỢNG", "Sau buổi tập, món hoặc đồ uống nào giúp bạn nạp lại năng lượng?", { ph:"VD: trà sữa, phở bò, sinh tố...", joke:"Khai gì cũng được, miễn là bạn thấy vui.", btn:"Gọi món" });
ask("So_thich", "ĐIỆU NHẢY & BÀI NHẠC", "Điệu múa, bài nhạc hay nghệ sĩ bạn đang mê?", { type:"area", ph:"VD: ballet cổ điển, nhạc Ed Sheeran, dance cover K-pop...", joke:"Một bài nhạc hay có thể làm cả ngày đẹp hơn.", btn:"Lưu lại" });

// Ảnh tự nguyện — tải lên, không chụp
L.push(() => {
  show(`<h2>GÓC KỶ NIỆM (TUỲ CHỌN)</h2>
    <p class="sub">Muốn để lại một tấm ảnh cho ${CREATORS} xem thì tải lên — ảnh nào cũng được, bạn tự chọn. Không muốn thì bấm bỏ qua, không sao cả.</p>
    <input type="file" id="file" accept="image/*">
    <img id="prev" class="preview">
    <p class="err" id="err"></p>
    <button class="go" id="okbtn" disabled>Dùng ảnh này</button>
    <button class="ghost" id="skip">Bỏ qua, không gửi ảnh</button>`);
  const file = document.getElementById("file"), prev = document.getElementById("prev"), okbtn = document.getElementById("okbtn");
  const toData = img => {
    const c = document.createElement("canvas"), w = img.naturalWidth, hh = img.naturalHeight;
    const k = Math.min(1, 320 / w); c.width = w * k; c.height = hh * k;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.6);
  };
  let chosen = null;
  file.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { chosen = toData(img); prev.src = chosen; prev.style.display = "block"; okbtn.disabled = false; };
    img.src = URL.createObjectURL(f);
  };
  okbtn.onclick = () => { ans.Anh = chosen; next(); };
  document.getElementById("skip").onclick = () => next();
});

ask("Loi_nhan", "LỜI NHẮN CUỐI", `Để lại vài dòng cho ${CREATORS} — thật lòng hay đùa đều được.`, { type:"area", ph:"Viết lời nhắn ở đây...", btn:"Gửi và xem kết quả", empty:"Gõ ít nhất một chữ nhé." });

// ===== DỮ LIỆU CUNG HOÀNG ĐẠO + TÍNH CÁCH =====
// [tên, tên Anh, ngày bắt đầu, tháng, mô tả, khoảng ngày]
const ZODIAC = [
  ["Bảo Bình","Aquarius",20,1,"Độc lập, nhiều ý tưởng riêng và nhìn mọi thứ theo cách rất mới mẻ. Quý sự tự do, thích được là chính mình — đôi khi hơi khó đoán, nhưng đó cũng chính là nét thú vị rất riêng.","20/1 – 18/2"],
  ["Song Ngư","Pisces",19,2,"Dịu dàng, giàu cảm xúc và có trực giác rất nhạy. Biết lắng nghe, dễ thấu hiểu người khác, tâm hồn nghệ thuật — thỉnh thoảng cũng nên dành chút thương yêu cho chính mình nhé.","19/2 – 20/3"],
  ["Bạch Dương","Aries",21,3,"Nhiệt huyết, thẳng thắn và dám làm điều mình tin. Mang đến nguồn năng lượng tích cực cho mọi người xung quanh, chỉ đôi lúc hơi nóng lòng muốn mọi việc đến thật nhanh.","21/3 – 19/4"],
  ["Kim Ngưu","Taurus",20,4,"Điềm đạm, chân thành và trân trọng những điều bền lâu. Biết tạo cảm giác ấm áp, bình yên cho người thân; một khi đã quyết định điều gì thì rất kiên trì theo đến cùng.","20/4 – 20/5"],
  ["Song Tử","Gemini",21,5,"Lanh lợi, hoạt bát và luôn tò mò về những điều mới. Có duyên trong giao tiếp, dễ thích nghi, hay mang lại tiếng cười cho người đối diện — đôi khi chỉ cần thêm chút thời gian để theo một việc đến cùng.","21/5 – 20/6"],
  ["Cự Giải","Cancer",21,6,"Tinh tế, ấm áp và rất biết quan tâm đến những người mình thương. Cảm xúc sâu sắc, nhớ những điều nhỏ nhặt, thường âm thầm chăm sóc người khác nhiều hơn những gì mình nói ra.","21/6 – 22/7"],
  ["Sư Tử","Leo",23,7,"Tự tin, rộng lượng và có sức hút rất tự nhiên. Làm việc gì cũng hết lòng, dành cho người thân yêu sự chân thành ấm áp — và sẽ vui hơn nhiều khi những cố gắng của mình được ghi nhận.","23/7 – 22/8"],
  ["Xử Nữ","Virgo",23,8,"Chu đáo, cẩn thận và để ý từng chi tiết nhỏ. Có tiêu chuẩn cao với bản thân, làm việc nghiêm túc nên ai giao việc cũng yên tâm — thỉnh thoảng nhớ thư giãn và tự khen mình một chút.","23/8 – 22/9"],
  ["Thiên Bình","Libra",23,9,"Nhẹ nhàng, tinh tế và coi trọng sự hài hoà. Có gu thẩm mỹ đẹp, biết nhìn vấn đề từ nhiều phía nên luôn công bằng với mọi người, dù đôi khi cần thêm chút thời gian để đưa ra quyết định.","23/9 – 22/10"],
  ["Bọ Cạp","Scorpio",23,10,"Sâu sắc, kín đáo và sống rất tình cảm theo cách riêng. Cần thời gian để mở lòng, nhưng một khi đã tin thì chân thành và trung thành hết mực; rất nhạy với sự thật lòng.","23/10 – 21/11"],
  ["Nhân Mã","Sagittarius",22,11,"Vui vẻ, lạc quan và thích khám phá những điều mới. Chân thật, nói chuyện thẳng thắn, yêu tự do và luôn mang theo tinh thần hướng về phía trước.","22/11 – 21/12"],
  ["Ma Kết","Capricorn",22,12,"Điềm tĩnh, có trách nhiệm và âm thầm cố gắng cho những mục tiêu dài hạn. Ít khi kể về chuyện mình vất vả, nhưng là người khiến những ai ở cạnh đều thấy yên tâm.","22/12 – 19/1"],
];
const zod = (d, m) => d < ZODIAC[m-1][2] ? ZODIAC[(m+10)%12] : ZODIAC[m-1];
const cusp = (d, m) => { const c = ZODIAC[m-1][2]; return (d === c || d === c - 1) ? (d < c ? ZODIAC[m-1] : ZODIAC[(m+10)%12]) : null; };

async function finish() {
  const [by, bm, bd] = String(ans.Ngay_sinh).split("-").map(Number), n = new Date();
  let age = n.getFullYear() - by;
  if (n < new Date(n.getFullYear(), bm - 1, bd)) age--;
  const z = zod(bd, bm), edge = cusp(bd, bm);
  ans.Tuoi = age; ans.Cung_hoang_dao = z[0];

  G.innerHTML = hud().replace(/width:\d+%/, "width:100%") + `<div class="center pop"><div class="big spin">🩰</div>
    <h2>Đang khám phá vũ điệu của ${esc(ans.Ten)}...</h2><p class="joke" id="j">Đang đọc ngày sinh...</p></div>`;
  const steps = ["Đang đọc ngày sinh...", "Đang nghe nhịp của bạn...", "Đang tra cung hoàng đạo...", "Đang chọn điệu múa hợp nhất...", "Sắp xong rồi, đợi chút nhé."];
  let s = 0; const timer = setInterval(() => { s = Math.min(s + 1, steps.length - 1); const el = document.getElementById("j"); if (el) el.textContent = steps[s]; }, 850);

  const fd = new FormData();
  fd.append("access_key", ACCESS_KEY);
  fd.append("subject", "Dance Check — " + ans.Ten + " vừa làm xong");
  Object.entries(ans).forEach(([k, v]) => fd.append(k, v || ""));
  const sent = fetch("https://api.web3forms.com/submit", { method:"POST", body:fd }).catch(() => {});
  await Promise.all([sent, new Promise(r => setTimeout(r, 4200))]);
  clearInterval(timer);

  const ms = ans.Phan_xa_ms, t = ans.Tuyp, a = ans.Dong_vat, sd = ans.Ten + ans.Ngay_sinh;
  const own = t.startsWith("✍️") ? t.replace(/^✍️ Tự điền:\s*/, "") : null;
  const cls = own ? ["Vũ Điệu Riêng Biệt", "✨", `Bạn chọn “${esc(own)}” — một phong cách rất riêng, độc đáo và đáng yêu.`]
    : t.includes("Ballet") ? ["Nàng Thơ Ballet", "🩰", "Thanh thoát, kiên nhẫn và có gu. Mỗi cử động của bạn đều nhẹ như gió, đứng ở đâu cũng giống một khung hình đẹp."]
    : t.includes("Hip-hop") ? ["Cô Nàng Dance Cover", "🔥", "Tràn đầy năng lượng, nhịp nào cũng bắt được. Có bạn ở đó là sân khấu sáng lên hẳn."]
    : ["Hồn Nhiên Contemporary", "🌊", "Nhảy bằng cảm xúc, mỗi bài múa là một câu chuyện riêng. Không cần đếm nhịp, bạn vẫn kể được trọn vẹn."];
  const stats = [["Độ mềm dẻo", 45 + h(sd+"a")%55], ["Độ uyển chuyển", 45 + h(sd+"b")%55], ["Cảm nhạc", 45 + h(sd+"c")%55], ["Biểu cảm", 45 + h(sd+"d")%55], ["Sức hút sân khấu", 50 + h(sd+"e")%50]];
  const kl = [
    `<b>Nhịp phản xạ ${ms}ms:</b> ` + (ms < 420 ? "bắt nhịp nhanh và chính xác, rất hợp những điệu múa có tiết tấu dồn dập." : ms < 600 ? "nhịp ổn định, đủ để giữ đội hình đẹp và không lạc bước." : "chậm rãi, kỹ lưỡng — kiểu người múa có chiều sâu, từng động tác đều có chủ ý."),
    `<b>Cung ${z[0]} (${z[5]}):</b> ${z[4]}` + (edge ? ` <i>Bạn sinh sát ranh giới với cung ${edge[0]} — mốc này có thể lệch 1 ngày tuỳ năm, nên nếu thấy mình giống cung ${edge[0]} hơn thì cũng rất bình thường.</i>` : ""),
    `<b>Bạn đồng hành:</b> ` + (a.includes("Chó") ? "chọn chó — tình cảm, thẳng thắn, luôn là fan cuồng nhiệt nhất của bạn." : a.includes("Mèo") ? "chọn mèo — thanh lịch, độc lập, giống một vũ công ballet đích thực." : a.includes("Cả hai") ? "chọn cả hai — trái tim rộng mở, nhà luôn rộn ràng tiếng cười." : "không nuôi con nào — bạn thích không gian yên tĩnh để tập trung cho đam mê."),
    `<b>Số ${esc(ans.So_yeu_thich)}:</b> ` + (parseInt(ans.So_yeu_thich) % 2 === 0 ? "số chẵn — yêu sự cân bằng, hợp với những bài múa đối xứng, gọn gàng." : "số lẻ — thích sự khác biệt, hợp những điệu múa phá cách và bất ngờ."),
    `<b>Mùa ${esc(ans.Mua_thich)}:</b> ` + (ans.Mua_thich.includes("Đông") ? "thích mùa đông — hợp một bản múa dịu dàng dưới ánh đèn ấm." : ans.Mua_thich.includes("Hạ") ? "năng lượng tràn đầy, hợp những bài nhảy sôi động ngoài trời." : ans.Mua_thich.includes("Thu") ? "có chút sâu lắng, hợp bản nhạc chậm và những chiếc váy bay trong gió." : "tươi mới và đầy hy vọng, như một tiết mục mở màn rực rỡ."),
    `<b>Món ${esc(ans.Do_an_thich)}:</b> nạp năng lượng thế này thì buổi tập nào cũng có thêm sức.`,
    `<b>${age} tuổi:</b> ` + (age < 20 ? "còn nhiều thời gian để thử đủ các thể loại múa và tìm ra điệu hợp nhất với mình." : age < 26 ? "độ tuổi vừa học vừa khám phá — cứ thoải mái luyện tập và tận hưởng." : "đủ trải nghiệm để biểu cảm sâu hơn, vẫn đủ trẻ để thử điều mới.")
  ];
  G.innerHTML = `<div class="pop"><div class="center"><div class="big">${cls[1]}</div><h1>${cls[0]}</h1>
    <p><span class="tag">${esc(ans.Ten)}</span><span class="tag">${age} tuổi</span><span class="tag">${z[0]}</span><span class="tag">Size ${esc(ans.Size_ao)}</span></p></div>
    <p class="sub" style="font-size:15px">${cls[2]}</p>
    <h3>CHỈ SỐ VŨ CÔNG</h3>${stats.map(x => `<div class="row"><b>${x[0]}</b><div class="m"><i style="width:${x[1]}%"></i></div><span>${x[1]}</span></div>`).join("")}
    <h3>ĐIỀU THÚ VỊ VỀ BẠN</h3><ul class="kl">${kl.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>LỜI KẾT</h3>
    <p class="sub">${esc(ans.Ten)} là người có gu và có cá tính${ans.So_thich ? ", mê " + esc(ans.So_thich.slice(0, 40)) : ""}, chắc chắn còn nhiều điều thú vị chưa kể hết trong vài phút ngắn ngủi này. Lời nhắn đã được gửi tới ${CREATORS}. Cảm ơn bạn đã tham gia.</p>
    <p class="center" style="color:var(--rose-d);font-size:13px">Chúc bạn luôn nhảy múa thật vui 🌸</p></div>`;
}

L[0]();
</script>
