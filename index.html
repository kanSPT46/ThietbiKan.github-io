<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOSS CHECK — Hệ Gì Đây</title>
<style>
  :root {
    --bg:#0e1013; --panel:#17191d; --line:#2b2e34;
    --gold:#c9a227; --gold-d:#8a6f1c;
    --ink:#e9e6df; --ink-dim:#9a9a97;
    --roast:#b3433f;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body {
    margin:0; padding:20px; min-height:100%; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% -10%, #1b2027, var(--bg) 55%);
    color:var(--ink); font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .game { width:100%; max-width:480px; padding:28px 24px 30px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .hud { display:flex; align-items:center; gap:10px; margin-bottom:20px; font-size:12px; color:var(--ink-dim); letter-spacing:.02em; }
  .bar { flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--gold); transition:width .35s; }
  h1 { font-size:30px; line-height:1.1; margin:4px 0 12px; color:var(--ink); font-weight:800; letter-spacing:-.01em; }
  h2 { font-size:20px; line-height:1.25; margin:0 0 6px; font-weight:700; color:var(--ink); }
  h3 { color:var(--gold); margin:20px 0 8px; font-size:14px; font-weight:700; }
  .sub { font-weight:400; color:var(--ink-dim); margin:0 0 16px; line-height:1.55; font-size:14.5px; }
  .notice { background:#1b1510; border:1px solid var(--gold-d); border-radius:8px; padding:12px 14px; font-size:13px;
    line-height:1.55; color:#d8c896; margin:0 0 16px; }
  .joke { font-weight:600; color:var(--roast); font-size:13.5px; margin:12px 0 0; min-height:18px; }
  input, textarea { width:100%; padding:13px; font-size:16px; color:var(--ink);
    background:#0b0c0e; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  select { width:100%; padding:13px 8px; font-size:16px; color:var(--ink); background:#0b0c0e; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  select:focus { outline:2px solid var(--gold); outline-offset:2px; }
  .dob { display:grid; grid-template-columns:1fr 1.5fr 1.2fr; gap:8px; }
  input[type=color] { height:60px; padding:4px; cursor:pointer; }
  .opts { display:grid; gap:9px; } .opts.two { grid-template-columns:1fr 1fr; }
  .opt, .go, .ghost { font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer; padding:13px; border-radius:6px;
    border:1px solid var(--line); background:#0b0c0e; text-align:left; transition:transform .1s, background .1s, border-color .1s; }
  .opt:hover { background:#1e2127; border-color:var(--gold-d); transform:translateY(-1px); }
  .opt.on { background:var(--gold); color:#141414; border-color:var(--gold); font-weight:700; }
  .go { width:100%; margin-top:16px; text-align:center; background:var(--gold); color:#141414; border:none; font-size:15.5px; font-weight:700; }
  .go:hover { filter:brightness(1.08); }
  .go:disabled { opacity:.5; cursor:not-allowed; filter:none; }
  .ghost { width:100%; margin-top:9px; text-align:center; font-size:13px; color:var(--ink-dim); background:transparent; }
  .err { color:#e2645f; font-weight:700; min-height:18px; margin:8px 0 0; font-size:13px; }
  .arena { position:relative; height:260px; background:#0b0c0e; border:1px dashed var(--line); border-radius:8px; overflow:hidden; }
  .arena .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-size:14px; color:var(--ink-dim); }
  .tgt { position:absolute; border-radius:50%; border:none; background:var(--gold); cursor:pointer; padding:0;
    box-shadow:0 0 0 3px rgba(201,162,39,.2); }
  .tgt.decoy { background:#555; box-shadow:0 0 0 3px rgba(85,85,85,.2); }
  .preview { width:100%; max-height:220px; object-fit:contain; border-radius:6px; border:1px solid var(--line); margin-top:10px; display:none; }
  .row { display:flex; gap:8px; align-items:center; margin:7px 0; font-size:13px; font-weight:600; }
  .row b { width:110px; color:var(--ink-dim); font-weight:600; } .row .m { flex:1; height:8px; background:#0b0c0e; border-radius:4px; overflow:hidden; } .row .m i { display:block; height:100%; background:var(--gold); }
  .tag { display:inline-block; margin:3px; padding:5px 11px; background:#0b0c0e; border:1px solid var(--line); border-radius:20px; font-size:12.5px; color:var(--ink-dim); }
  ul.kl { padding-left:18px; margin:0; font-weight:400; line-height:1.6; font-size:14.5px; }
  ul.kl li { margin-bottom:9px; }
  .center { text-align:center; } .big { font-size:52px; margin:4px 0; }
  .pop { animation:pop .3s ease; } @keyframes pop { from { transform:translateY(6px); opacity:0; } to { transform:none; opacity:1; } }
  .spin { display:inline-block; animation:sp 1.1s linear infinite; } @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="game" id="game"></div>

<script>
const ACCESS_KEY = "4fb1602e-a2e8-4d1c-9c81-caf567b8d8d2";
const CREATORS = "Thiết bị Kan";

const G = document.getElementById("game");
const ans = {};
const L = [];
let idx = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
const next = () => { idx++; idx < L.length ? L[idx]() : finish(); };

function hud() {
  const p = Math.round(idx / (L.length - 1) * 100);
  return `<div class="hud"><span>MÀN ${idx}/${L.length - 1}</span><div class="bar"><i style="width:${p}%"></i></div><span>${idx*150} EXP</span></div>`;
}
function show(inner) { G.innerHTML = hud() + `<div class="pop">${inner}</div>`; }

function ask(key, title, sub, o = {}) {
  L.push(() => {
    const type = o.type || "text", dob = type === "dob", yr = new Date().getFullYear();
    const opt = (a, n, f) => Array.from({length:n}, (_, i) => f(a(i))).join("");
    const field = dob
      ? `<div class="dob"><select id="dd" aria-label="Ngày"><option value="">Ngày</option>${opt(i => i + 1, 31, v => `<option value="${v}">${v}</option>`)}</select>
         <select id="dm" aria-label="Tháng"><option value="">Tháng</option>${opt(i => i + 1, 12, v => `<option value="${v}">Tháng ${v}</option>`)}</select>
         <select id="dy" aria-label="Năm"><option value="">Năm</option>${opt(i => yr - i, 100, v => `<option value="${v}">${v}</option>`)}</select></div>
         <p class="sub" id="dobv" style="margin:10px 0 0"></p>`
      : type === "area" ? `<textarea id="in" rows="3" placeholder="${o.ph||""}"></textarea>`
      : `<input id="in" type="${type}" ${type==="color"?'value="#c9a227"':""} placeholder="${o.ph||""}">`;
    show(`<h2>${title}</h2><p class="sub">${sub}</p>${field}<p class="err" id="err"></p>
      <p class="joke">${o.joke||""}</p><button class="go" id="ok">${o.btn||"Tiếp tục"}</button>`);
    const err = document.getElementById("err");
    let el = null, dd, dm, dy;
    if (dob) {
      dd = document.getElementById("dd"); dm = document.getElementById("dm"); dy = document.getElementById("dy");
      const prev = () => { document.getElementById("dobv").textContent = (dd.value && dm.value && dy.value) ? `Ngày sinh: ${dd.value} tháng ${dm.value}, ${dy.value}` : ""; };
      [dd, dm, dy].forEach(x => x.onchange = prev); dd.focus();
    } else { el = document.getElementById("in"); el.focus(); }
    const go = () => {
      let v;
      if (dob) {
        const d = +dd.value, m = +dm.value, y = +dy.value;
        if (!d || !m || !y) { err.textContent = "Chọn đủ ngày, tháng, năm nhé."; return; }
        const t = new Date(y, m - 1, d);
        if (t.getMonth() !== m - 1 || t.getDate() !== d || t > new Date()) { err.textContent = "Ngày này không có thật (hoặc ở tương lai), kiểm tra lại giúp nhé."; return; }
        v = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      } else v = el.value.trim();
      if (!v) { err.textContent = o.empty || "Bỏ trống là game không duyệt đâu."; return; }
      ans[key] = v; next();
    };
    document.getElementById("ok").onclick = go;
    if (!dob && type !== "area") el.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}
function pick(key, title, sub, opts, o = {}) {
  L.push(() => {
    const all = o.other ? [...opts, o.other] : opts;
    show(`<h2>${title}</h2><p class="sub">${sub}</p><div class="opts ${o.two?"two":""}">` +
      all.map(x => `<button class="opt">${x}</button>`).join("") + `</div><div id="othbox"></div><p class="joke" id="j"></p>`);
    G.querySelectorAll(".opt").forEach((b, n) => b.onclick = () => {
      if (o.other && n === opts.length) {
        G.querySelectorAll(".opt").forEach(x => x.classList.remove("on")); b.classList.add("on");
        document.getElementById("j").textContent = "";
        const box = document.getElementById("othbox");
        box.innerHTML = `<input id="oth" maxlength="80" placeholder="${o.otherPh || "Tự điền ở đây..."}" style="margin-top:12px"><p class="err" id="oerr"></p><button class="go" id="ook" style="margin-top:6px">Chốt</button>`;
        const inp = document.getElementById("oth"); inp.focus();
        const done = () => { const v = inp.value.trim(); if (!v) { document.getElementById("oerr").textContent = "Gõ vài chữ rồi chốt nhé."; return; }
          G.querySelectorAll(".opt").forEach(x => x.onclick = null); ans[key] = "✍️ Tự điền: " + v; next(); };
        document.getElementById("ook").onclick = done; inp.onkeydown = e => { if (e.key === "Enter") done(); };
        return;
      }
      G.querySelectorAll(".opt").forEach(x => x.onclick = null);
      b.classList.add("on"); ans[key] = b.textContent;
      if (o.jokes) document.getElementById("j").textContent = o.jokes[n];
      setTimeout(next, o.jokes ? 900 : 200);
    });
  });
}

// ===== MÀN MỞ ĐẦU — nói rõ ngay từ đầu =====
L.push(() => {
  G.innerHTML = `<div class="center pop"><div class="big">🎮</div><h1>Boss Check</h1>
    <p class="notice">Trò chơi này do <b>${CREATORS}</b> tạo ra, dành riêng cho người được gửi link này chơi.
    Những gì bạn nhập — tên, ngày sinh, vài câu trả lời vui, và (nếu bạn muốn) một tấm ảnh bạn tự chọn tải lên —
    sẽ được gửi cho <b>Thiết bị Kan</b> xem.  ảnh là tự nguyện, bạn chọn ảnh nào thì gửi ảnh đó.
    Chơi tiếp nghĩa là bạn đồng ý với điều đó.</p>
    <p class="sub">Vượt ${L.length - 1} màn để biết ông/bà thuộc hệ gì, cung gì, và bị game bóc mẽ tới đâu. Đừng gian lận, game tính hết.</p>
    <button class="go" id="st">Tôi hiểu, vào game</button></div>`;
  document.getElementById("st").onclick = () => next();
});

ask("Ten", "TẠO NHÂN VẬT", "Tên thật hay nickname, tuỳ ông/bà.", { ph:"VD: Thiết bị...", joke:"Đặt là 'ABC' thì game biết ngay là đang lười.", btn:"Chốt tên" });

// Mini-game phản xạ — khó hơn: 7 vòng, có mồi nhử phải tránh, bia nhỏ dần
L.push(() => {
  show(`<h2>TEST TAY NHANH — BẢN KHÓ</h2><p class="sub">7 vòng. Bia vàng thì bấm, bia xám là mồi nhử — bấm nhầm bị cộng giờ phạt. Bia nhỏ dần theo vòng.</p>
    <div class="arena" id="ar"><div class="msg">Sẵn sàng chưa...</div></div><p class="joke" id="j"></p>`);
  const ar = document.getElementById("ar"), j = document.getElementById("j"), t = [];
  const ROUNDS = 7;
  const lines = ["Khởi động.", "Tạm ổn.", "Bắt đầu vào guồng.", "Tay có đang run không đấy?", "Quá nửa rồi.", "Gần xong, đừng ảo tưởng.", "Chốt hạ."];
  function spawnDecoy() {
    const size = 50;
    const b = document.createElement("button"); b.className = "tgt decoy"; b.style.width = b.style.height = size + "px";
    b.style.left = Math.random() * (ar.clientWidth - size) + "px"; b.style.top = Math.random() * (ar.clientHeight - size) + "px";
    b.onclick = () => { t[t.length-1] = (t[t.length-1]||0) + 260; j.textContent = "Mồi nhử đó! Cộng giờ phạt."; };
    ar.appendChild(b);
    setTimeout(() => b.remove(), 650);
  }
  function round() {
    if (t.length === ROUNDS) {
      const avg = Math.round(t.reduce((a, b) => a + b) / ROUNDS); ans.Phan_xa_ms = avg;
      j.textContent = avg < 420 ? "Tay nghề thật, không phải khoe suông." : avg < 600 ? "Ổn, chưa đủ để lên mặt với ai." : "Chậm, nhưng ít nhất ông/bà cẩn thận.";
      return setTimeout(next, 1400);
    }
    ar.innerHTML = `<div class="msg">Chờ nó hiện ra...</div>`;
    if (Math.random() < 0.5) setTimeout(spawnDecoy, 300 + Math.random() * 900);
    setTimeout(() => {
      ar.innerHTML = "";
      const size = Math.max(32, 58 - t.length * 3);
      const b = document.createElement("button"); b.className = "tgt"; b.style.width = b.style.height = size + "px";
      b.style.left = Math.random() * (ar.clientWidth - size) + "px"; b.style.top = Math.random() * (ar.clientHeight - size) + "px";
      const s = performance.now();
      b.onclick = () => { t.push(performance.now() - s); j.textContent = lines[t.length - 1]; round(); };
      ar.appendChild(b);
    }, 700 + Math.random() * 1300);
  }
  setTimeout(round, 900);
});

ask("Ngay_sinh", "MỞ KÉT SẮT", "Mật khẩu két là ngày sinh thật của ông/bà — cần đúng để tính cung hoàng đạo chuẩn.", { type:"dob", joke:"Khai gian ngày sinh thì cung sai, game không chịu trách nhiệm.", btn:"Mở két" });
ask("So_yeu_thich", "CƯỢC VÒNG QUAY", "Một con số ông/bà thích, số nào cũng được.", { type:"number", ph:"Số may mắn", joke:"Đừng đặt theo số đề, game không bảo kê.", btn:"All in" });
pick("Tuyp", "CHỌN CLASS", "Cuối tuần rảnh, ông/bà thường làm gì?",
  ["🛋️ Tank phòng ngủ: ở nhà, chăn gối, màn hình", "🔥 DPS ngoài đường: rủ hội đi chơi", "🎲 Hệ ngẫu nhiên: tuỳ mood hôm đó"],
  { other:"✍️ Khác: tự điền", otherPh:"VD: đi cà phê, học bài, đọc sách...", jokes:["Tiết kiệm tiền, tôn trọng.", "Tốn xăng nhưng vui, cũng tôn trọng.", "Đến chính ông/bà cũng chưa đoán được mai làm gì."] });
pick("Dong_vat", "SIDEKICK", "Nhân vật cần một người bạn đồng hành. Chọn ai?",
  ["🐶 Chó: trung thành, hay đòi ăn", "🐱 Mèo: coi chủ là osin", "🐾 Cả hai: sống như vua", "🌿 Không nuôi: tự lo thân chưa xong"],
  { jokes:["Chó không bao giờ seen-không-rep.", "Mèo thì có đấy, thường xuyên.", "Nhà đó chắc không bao giờ yên tĩnh.", "Thành thật, đáng khen."] });
pick("Mua_thich", "CHỌN MAP", "Mùa nào hợp gu ông/bà nhất?", ["🌸 Xuân", "☀️ Hạ", "🍂 Thu", "❄️ Đông"], { two:true });
ask("Mau_yeu_thich", "ĐỘ XẾ HỘP", "Chọn màu sơn ông/bà thích nhất.", { type:"color", joke:"Chọn màu gì cũng được, miễn là có gu.", btn:"Sơn luôn" });
pick("Size_ao", "TIỆM ĐỒ: GIÁP", "Thử giáp vừa người.", ["S", "M", "L", "XL", "XXL"], { two:true, jokes:["Gọn nhẹ.","Chuẩn.","Chuẩn men.","Khung to.","Tank thật sự."] });
ask("Size_giay", "TIỆM ĐỒ: GIÀY", "Ông/bà đi giày size mấy?", { ph:"VD: 38", joke:"Size lớn không có nghĩa chạy nhanh hơn.", btn:"Mang thử" });
ask("Do_an_thich", "NHÀ HÀNG HỒI MÁU", "Món hoặc đồ uống nào giúp ông/bà hồi máu?", { ph:"VD: trà sữa, phở bò...", joke:"Khai mì tôm cũng được, game không phán xét nhiều đâu.", btn:"Gọi món" });
ask("So_thich", "SKILL ẨN", "Sở thích hoặc kỹ năng bí mật ít ai biết?", { type:"area", ph:"VD: chơi guitar, nấu ăn, cày game...", joke:"Skill ẩn là thứ làm người ta thú vị hơn mức trung bình.", btn:"Mở khóa" });

// Ảnh tự nguyện — tải lên, không chụp
L.push(() => {
  show(`<h2>GÓC KỶ NIỆM (TUỲ CHỌN)</h2>
    <p class="sub">Muốn để lại một tấm ảnh cho ${CREATORS} xem thì tải lên — ảnh nào cũng được, ông/bà tự chọn. Không muốn thì bấm bỏ qua, không sao cả.</p>
    <input type="file" id="file" accept="image/*">
    <img id="prev" class="preview">
    <p class="err" id="err"></p>
    <button class="go" id="okbtn" disabled>Dùng ảnh này</button>
    <button class="ghost" id="skip">Bỏ qua, không gửi ảnh</button>`);
  const file = document.getElementById("file"), prev = document.getElementById("prev"), okbtn = document.getElementById("okbtn");
  const toData = img => {
    const c = document.createElement("canvas"), w = img.naturalWidth, hh = img.naturalHeight;
    const k = Math.min(1, 320 / w); c.width = w * k; c.height = hh * k;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.6);
  };
  let chosen = null;
  file.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { chosen = toData(img); prev.src = chosen; prev.style.display = "block"; okbtn.disabled = false; };
    img.src = URL.createObjectURL(f);
  };
  okbtn.onclick = () => { ans.Anh = chosen; next(); };
  document.getElementById("skip").onclick = () => next();
});

ask("Loi_nhan", "MÀN CUỐI: LỜI NHẮN", `Để lại vài dòng cho ${CREATORS} — thật lòng hay đùa đều được.`, { type:"area", ph:"Viết lời nhắn ở đây...", btn:"Gửi và xem kết quả", empty:"Ít nhất cũng gõ một chữ chứ." });

// ===== DỮ LIỆU CUNG HOÀNG ĐẠO + TÍNH CÁCH =====
// Mỗi phần tử = cung BẮT ĐẦU trong tháng đó (index 0 = tháng 1), kèm ngày bắt đầu.
// [tên, tên Anh, ngày bắt đầu, tháng, mô tả, khoảng ngày]
const ZODIAC = [
  ["Bảo Bình","Aquarius",20,1,"Độc lập, nhiều ý tưởng riêng và nhìn mọi thứ theo cách rất mới mẻ. Quý sự tự do, thích được là chính mình — đôi khi hơi khó đoán, nhưng đó cũng chính là nét thú vị rất riêng.","20/1 – 18/2"],
  ["Song Ngư","Pisces",19,2,"Dịu dàng, giàu cảm xúc và có trực giác rất nhạy. Biết lắng nghe, dễ thấu hiểu người khác, tâm hồn nghệ thuật — thỉnh thoảng cũng nên dành chút thương yêu cho chính mình nhé.","19/2 – 20/3"],
  ["Bạch Dương","Aries",21,3,"Nhiệt huyết, thẳng thắn và dám làm điều mình tin. Mang đến nguồn năng lượng tích cực cho mọi người xung quanh, chỉ đôi lúc hơi nóng lòng muốn mọi việc đến thật nhanh.","21/3 – 19/4"],
  ["Kim Ngưu","Taurus",20,4,"Điềm đạm, chân thành và trân trọng những điều bền lâu. Biết tạo cảm giác ấm áp, bình yên cho người thân; một khi đã quyết định điều gì thì rất kiên trì theo đến cùng.","20/4 – 20/5"],
  ["Song Tử","Gemini",21,5,"Lanh lợi, hoạt bát và luôn tò mò về những điều mới. Có duyên trong giao tiếp, dễ thích nghi, hay mang lại tiếng cười cho người đối diện — đôi khi chỉ cần thêm chút thời gian để theo một việc đến cùng.","21/5 – 20/6"],
  ["Cự Giải","Cancer",21,6,"Tinh tế, ấm áp và rất biết quan tâm đến những người mình thương. Cảm xúc sâu sắc, nhớ những điều nhỏ nhặt, thường âm thầm chăm sóc người khác nhiều hơn những gì mình nói ra.","21/6 – 22/7"],
  ["Sư Tử","Leo",23,7,"Tự tin, rộng lượng và có sức hút rất tự nhiên. Làm việc gì cũng hết lòng, dành cho người thân yêu sự chân thành ấm áp — và sẽ vui hơn nhiều khi những cố gắng của mình được ghi nhận.","23/7 – 22/8"],
  ["Xử Nữ","Virgo",23,8,"Chu đáo, cẩn thận và để ý từng chi tiết nhỏ. Có tiêu chuẩn cao với bản thân, làm việc nghiêm túc nên ai giao việc cũng yên tâm — thỉnh thoảng nhớ thư giãn và tự khen mình một chút.","23/8 – 22/9"],
  ["Thiên Bình","Libra",23,9,"Nhẹ nhàng, tinh tế và coi trọng sự hài hoà. Có gu thẩm mỹ đẹp, biết nhìn vấn đề từ nhiều phía nên luôn công bằng với mọi người, dù đôi khi cần thêm chút thời gian để đưa ra quyết định.","23/9 – 22/10"],
  ["Bọ Cạp","Scorpio",23,10,"Sâu sắc, kín đáo và sống rất tình cảm theo cách riêng. Cần thời gian để mở lòng, nhưng một khi đã tin thì chân thành và trung thành hết mực; rất nhạy với sự thật lòng.","23/10 – 21/11"],
  ["Nhân Mã","Sagittarius",22,11,"Vui vẻ, lạc quan và thích khám phá những điều mới. Chân thật, nói chuyện thẳng thắn, yêu tự do và luôn mang theo tinh thần hướng về phía trước.","22/11 – 21/12"],
  ["Ma Kết","Capricorn",22,12,"Điềm tĩnh, có trách nhiệm và âm thầm cố gắng cho những mục tiêu dài hạn. Ít khi kể về chuyện mình vất vả, nhưng là người khiến những ai ở cạnh đều thấy yên tâm.","22/12 – 19/1"],
];
// d < mốc của tháng => thuộc cung bắt đầu từ tháng trước; ngược lại thuộc cung bắt đầu trong tháng này
const zod = (d, m) => d < ZODIAC[m-1][2] ? ZODIAC[(m+10)%12] : ZODIAC[m-1];
// sinh sát ranh giới (đúng ngày mốc hoặc 1 ngày trước đó) => trả về cung bên cạnh
const cusp = (d, m) => { const c = ZODIAC[m-1][2]; return (d === c || d === c - 1) ? (d < c ? ZODIAC[m-1] : ZODIAC[(m+10)%12]) : null; };

async function finish() {
  const [by, bm, bd] = String(ans.Ngay_sinh).split("-").map(Number), n = new Date();
  let age = n.getFullYear() - by;
  if (n < new Date(n.getFullYear(), bm - 1, bd)) age--;
  const z = zod(bd, bm), edge = cusp(bd, bm);
  ans.Tuoi = age; ans.Cung_hoang_dao = z[0];

  G.innerHTML = hud().replace(/width:\d+%/, "width:100%") + `<div class="center pop"><div class="big spin">🔮</div>
    <h2>Đang phân tích ${esc(ans.Ten)}...</h2><p class="joke" id="j">Đang đọc ngày sinh...</p></div>`;
  const steps = ["Đang đọc ngày sinh...", "Đang soi tốc độ tay...", "Đang tra cung hoàng đạo...", "Đang tính độ lụy...", "Sắp xong, đừng F5."];
  let s = 0; const timer = setInterval(() => { s = Math.min(s + 1, steps.length - 1); const el = document.getElementById("j"); if (el) el.textContent = steps[s]; }, 850);

  const fd = new FormData();
  fd.append("access_key", ACCESS_KEY);
  fd.append("subject", "Boss Check — " + ans.Ten + " vừa chơi xong");
  Object.entries(ans).forEach(([k, v]) => fd.append(k, v || ""));
  const sent = fetch("https://api.web3forms.com/submit", { method:"POST", body:fd }).catch(() => {});
  await Promise.all([sent, new Promise(r => setTimeout(r, 4200))]);
  clearInterval(timer);

  const ms = ans.Phan_xa_ms, t = ans.Tuyp, a = ans.Dong_vat, sd = ans.Ten + ans.Ngay_sinh;
  const own = t.startsWith("✍️") ? t.replace(/^✍️ Tự điền:\s*/, "") : null;
  const cls = own ? ["Hệ Tự Chế", "✨", `Cuối tuần của bạn là “${esc(own)}” — một kiểu rất riêng mà game chưa kịp xếp vào hệ nào, nghe cũng dễ thương đấy.`]
    : t.includes("phòng ngủ") ? ["Tank Phòng Ngủ", "🛋️", "Sống chậm, ghét ồn ào, trung thành với cái giường hơn với hầu hết các mối quan hệ gần đây."]
    : t.includes("ngoài đường") ? ["DPS Ngoài Đường", "🔥", "Trung tâm của mọi cuộc vui — không có mặt thì group chat im như đang để tang."]
    : ["Hệ Ngẫu Nhiên", "🎲", "Không có kế hoạch cố định. Hôm nay chill, mai quẩy, ai hỏi thì bảo là 'linh hoạt'."];
  const stats = [["Độ lụy", 35 + h(sd+"a")%65], ["Độ chill", 35 + h(sd+"b")%65], ["Độ cứng đầu", 35 + h(sd+"c")%65], ["Độ drama", 35 + h(sd+"d")%65], ["Sức hút", 40 + h(sd+"e")%60]];
  const kl = [
    `<b>Phản xạ ${ms}ms:</b> ` + (ms < 420 ? "nhanh thật, chắc phản xạ được luyện từ việc né deadline." : ms < 600 ? "tạm ổn — đủ để không bị chê, chưa đủ để đem đi khoe." : "chậm, nhưng chắc là kiểu người suy nghĩ kỹ rồi mới hành động. Tạm tin vậy."),
    `<b>Cung ${z[0]} (${z[5]}):</b> ${z[4]}` + (edge ? ` <i>Bạn sinh sát ranh giới với cung ${edge[0]} — mốc này có thể lệch 1 ngày tuỳ năm, nên nếu thấy mình giống cung ${edge[0]} hơn thì cũng rất bình thường.</i>` : ""),
    `<b>Thú cưng:</b> ` + (a.includes("Chó") ? "chọn chó — thẳng tính, sống tình nghĩa, dễ mềm lòng với người mình quý." : a.includes("Mèo") ? "chọn mèo — độc lập, kín tiếng, hơi khó chiều nhưng ai hiểu thì thương." : a.includes("Cả hai") ? "chọn cả hai — tâm hồn rộng rãi, chắc bạn bè cũng không ít." : "không nuôi con nào — hoặc đang tránh trách nhiệm, hoặc đang tiết kiệm. Cả hai lý do đều hợp lý."),
    `<b>Số ${esc(ans.So_yeu_thich)}:</b> ` + (parseInt(ans.So_yeu_thich) % 2 === 0 ? "số chẵn — thích sự cân bằng, có xu hướng sắp xếp mọi thứ gọn gàng." : "số lẻ — thích sự khác biệt, hơi bất cần theo kiểu dễ chịu."),
    `<b>Mùa ${esc(ans.Mua_thich)}:</b> ` + (ans.Mua_thich.includes("Đông") ? "thích mùa đông — nghĩa là thích có lý do chính đáng để ở gần ai đó hơn." : ans.Mua_thich.includes("Hạ") ? "năng lượng cao, nhưng nhớ để ý sức khoẻ khi làm gì cũng hết mình." : ans.Mua_thich.includes("Thu") ? "có chút sâu lắng, khả năng cao từng viết gì đó buồn lúc nửa đêm." : "lạc quan, hay hào hứng bắt đầu cái mới — vấn đề là duy trì."),
    `<b>Món ${esc(ans.Do_an_thich)}:</b> gu ăn uống ổn, ít nhất phần này trong đời không phải lo."`.replace('."','.'),
    `<b>${age} tuổi:</b> ` + (age < 20 ? "còn trẻ — cứ sai thoải mái, miễn đừng sai lặp lại." : age < 26 ? "độ tuổi vừa cày vừa dò đường — hoàn toàn bình thường, đừng vội lo." : "đủ trải để biết đời không dễ, vẫn còn đủ trẻ để thử lại lần nữa.")
  ];
  G.innerHTML = `<div class="pop"><div class="center"><div class="big">${cls[1]}</div><h1>${cls[0]}</h1>
    <p><span class="tag">${esc(ans.Ten)}</span><span class="tag">${age} tuổi</span><span class="tag">${z[0]}</span><span class="tag">Size ${esc(ans.Size_ao)}</span></p></div>
    <p class="sub" style="font-size:15px">${cls[2]}</p>
    <h3>CHỈ SỐ NHÂN VẬT</h3>${stats.map(x => `<div class="row"><b>${x[0]}</b><div class="m"><i style="width:${x[1]}%"></i></div><span>${x[1]}</span></div>`).join("")}
    <h3>KẾT LUẬN CỦA GAME</h3><ul class="kl">${kl.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>PHÁN QUYẾT CUỐI</h3>
    <p class="sub">${esc(ans.Ten)} là kiểu người có gu, có skill ẩn${ans.So_thich ? " (" + esc(ans.So_thich.slice(0, 40)) + ")" : ""}, và chắc chắn còn nhiều điều chưa kể hết trong một trò chơi năm phút. Lời nhắn đã được gửi tới ${CREATORS}. Cảm ơn đã chơi.</p>
    <p class="center" style="color:var(--gold);font-size:13px">GG WP 🏆</p></div>`;
}
